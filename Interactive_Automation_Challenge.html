<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ef">
<title>Interactive Automation Challenge | S11 Microteach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f5ef;--white:#fffefa;--ink:#183235;--body:#2b4447;--muted:#627779;--accent:#0d6b67;--accentDark:#074d4b;--soft:#e7f2ed;--line:#d8e1db;--warm:#fbefdd;--warn:#925716;--shadow:0 12px 38px rgba(19,58,54,.055)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);font:17px/1.46 'Lato',Arial,sans-serif;color:var(--body)}h1,h2,h3,.brand,.stepNumber{font-family:'Ubuntu','Trebuchet MS',sans-serif;color:var(--ink)}h1,h2,h3,p{margin-top:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #4d94df;outline-offset:3px}.app{max-width:1110px;margin:0 auto;padding:29px 35px 36px}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:23px}.kicker{font-size:12px;letter-spacing:.15em;font-weight:900;text-transform:uppercase;color:var(--accent);margin-bottom:7px}.brand{font-size:clamp(28px,3.6vw,43px);font-weight:700;letter-spacing:-.035em;line-height:1.1}.header p{font-size:16px;color:var(--muted);margin:9px 0 0}.stamp{border:1px solid #cddbd2;border-radius:999px;font-size:13px;white-space:nowrap;padding:9px 12px;color:var(--accentDark);font-weight:900;background:#eef5ed}.scenarioBar{border:1px solid var(--line);background:var(--white);border-radius:16px;padding:14px 17px 17px;margin-bottom:18px;box-shadow:var(--shadow)}.subhead{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}.scenarios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.scenarioBtn{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;text-align:left;min-height:69px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:12px;transition:border-color .14s,background .14s}.scenarioBtn:hover{border-color:#82b4a6}.scenarioBtn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}.scenarioIcon{width:32px;height:32px;flex:none;background:#f0f4f0;border-radius:8px;display:grid;place-items:center;font-size:19px}.scenarioBtn[aria-pressed="true"] .scenarioIcon{background:#d4e9df}.workarea{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 30px 25px;min-height:490px}.progress{display:flex;gap:8px;align-items:center;margin-bottom:24px}.prog{height:5px;background:#e7ede9;flex:1;border-radius:3px}.prog.done{background:var(--accent)}.stepLine{display:flex;align-items:center;gap:11px;margin-bottom:11px}.stepNumber{background:var(--soft);color:var(--accentDark);display:grid;place-items:center;border-radius:8px;font-weight:700;font-size:14px;width:35px;height:35px}.stepName{font-size:12px;font-weight:900;color:var(--accent);letter-spacing:.12em;text-transform:uppercase}h2{font-size:clamp(24px,3vw,32px);margin-bottom:12px;line-height:1.2;letter-spacing:-.024em}h3{font-size:20px;margin-bottom:8px}.lead{font-size:18px;max-width:880px}.facts{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0 21px}.fact{background:#eef4ef;border:1px solid #e1ebe3;border-radius:7px;padding:7px 10px;font-size:13px;font-weight:900;color:#3c5a50}.prompt{font:700 20px/1.3 'Ubuntu','Trebuchet MS',sans-serif;color:var(--ink);margin:12px 0 13px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{border:1.5px solid var(--line);background:#fff;border-radius:12px;text-align:left;padding:17px;min-height:112px;color:var(--body);transition:.14s}.choice b{font:700 19px 'Ubuntu','Trebuchet MS',sans-serif;display:block;color:var(--ink);margin-bottom:6px}.choice span{font-size:15px;color:#55696a}.choice[data-choice="approach"] b{text-align:center}.choice:hover{border-color:#84b1a7}.choice[aria-pressed="true"]{border-color:var(--accent);background:#eef8f3;box-shadow:inset 0 0 0 1px var(--accent)}.choices.compact .choice{min-height:95px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}.primary,.secondary{border-radius:9px;padding:11px 18px;font-size:15px;font-weight:900;border:1px solid transparent}.primary{background:var(--accent);color:white}.primary:hover:not(:disabled){background:var(--accentDark)}.primary:disabled{opacity:.43;cursor:not-allowed}.secondary{background:transparent;color:var(--accentDark);border-color:#c8d9d0}.secondary:hover{background:var(--soft)}.smallprint{font-size:13px;color:var(--muted)}.feedback{border-left:4px solid var(--accent);border-radius:8px;background:#eef7f1;margin:18px 0 0;padding:14px 17px}.feedback strong{display:block;font-weight:900;color:var(--accentDark);margin-bottom:4px}.feedback p{margin:0;font-size:15px}.feedback.caution{background:#fff6e7;border-color:#c68c3d}.feedback.caution strong{color:#855117}.flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:16px 0 20px}.flowNode{flex:1 1 130px;min-width:110px;padding:12px 10px;border:1px solid #cddfd4;background:#f2f8f3;border-radius:9px;text-align:center;font-weight:900;font-size:14px;color:#24594c}.flowNode.warm{background:#fff2df;border-color:#ead2ae;color:#86541b}.flowArrow{align-self:center;color:var(--accent);font-weight:900}.rule{height:1px;background:var(--line);margin:20px 0}.evidence{background:#f2f5f1;border:1px solid #dce5dd;border-radius:12px;padding:16px 18px;margin-top:20px}.evidence h3{font-size:18px}.evidence ul{margin:8px 0 0;padding-left:22px;font-size:15px}.evidence li+li{margin-top:5px}.twoCols{display:grid;grid-template-columns:1fr 1fr;gap:15px}.miniCard{padding:14px 15px;border:1px solid var(--line);border-radius:10px;background:#fff}.miniCard strong{display:block;color:var(--ink);margin-bottom:5px}.miniCard p{font-size:15px;margin:0}.lesson{font:700 22px/1.3 'Ubuntu','Trebuchet MS',sans-serif;margin:19px 0;color:var(--ink)}.footer{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px;padding:15px 4px}.hidden{display:none!important}#stage{scroll-margin-top:18px}@media(max-width:760px){.app{padding:18px 14px}.header{display:block}.stamp{display:inline-block;margin-top:14px}.scenarios{grid-template-columns:1fr}.scenarioBtn{min-height:54px}.workarea{padding:20px 17px;min-height:0}.choices,.twoCols{grid-template-columns:1fr}.flowArrow{display:none}.flowNode{flex-basis:100%}.footer{display:block}.footer span{display:block;margin-bottom:6px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}@media print{.app{max-width:none}.controls,.scenarioBar{display:none}.workarea{box-shadow:none}.footer{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div><div class="kicker">Level 4 AI &amp; Automation Expert · S11</div><div class="brand">Interactive Automation Challenge</div><p>Choose an approach. Defend your reasoning. Test the failure path.</p></div>
    <div class="stamp">INTERACTIVE LEARNING EXERCISE</div>
  </header>
  <nav class="scenarioBar" aria-label="Select a workplace scenario">
    <div class="subhead">Choose a workplace scenario</div>
    <div class="scenarios" id="scenarioButtons"></div>
  </nav>
  <main class="workarea" id="stage" tabindex="-1" aria-live="polite"></main>
</div>
<script>
'use strict';
const scenarios = {
  support: {
    name:'Customer support requests', icon:'🎧',
    situation:'A customer sends a support request through an online form. The team wants to acknowledge it immediately and route requests to the right queue using clear, predefined categories.',
    facts:['Helpdesk has native connectors','Categories are rule-based','No AI needed initially'],
    baseFlow:['Customer form','Routing rules','Support queue','Acknowledgement'],
    whyNo:'A native form-to-helpdesk connector and simple routing rules meet the stated requirements. Introducing custom code or AI at this point would add unnecessary complexity.',
    whyLow:'Low-code can solve the problem, but there is no identified gap in the native connectors or rules. First explain what custom logic would achieve that the existing tools cannot.',
    probeNo:{q:'What limitation should you check before choosing no-code?', options:[['Whether the connector supports the required fields, access controls and error handling','The right check'],['Whether custom code would look more impressive','Not a technical requirement']], explain:'Check field mappings, permissions, connector limits and how failed deliveries are detected. A label such as “no-code” does not guarantee the integration is suitable.'},
    probeLow:{q:'What would justify adding custom logic?', options:[['A requirement the native connector or rules cannot reliably handle','A defensible justification'],['A preference to write code even when the workflow is already supported','Not sufficient on its own']], explain:'Custom development should solve a real capability gap. Compare the extra flexibility against maintenance, security and testing effort.'},
    change:'Later, customers begin sending free-text enquiries in several languages. The helpdesk has no ready-made connector for the company’s specialist CRM, but the CRM offers an API.',
    question:'Does this automatically require low-code or AI?',
    changeOptions:[['No. Check the CRM API and existing platform capabilities; assess whether AI classification is actually needed.','recommended'],['Yes. A missing connector always requires custom code and AI.','weak']],
    changeGood:'Correct direction. An HTTP-capable no-code tool or custom connector may be enough. If categories cannot be captured reliably with rules, AI classification could be evaluated—with confidence thresholds and human review.',
    changeWeak:'Not automatically. A missing prebuilt connector does not mean custom coding is mandatory; free text does not automatically justify AI. Evaluate the actual integration and classification needs.',
    finalPrompt:'The CRM returns HTTP 429 (rate limit) after a customer submits a ticket. What should the workflow do?',
    failureChoices:[['Retry with controlled backoff, avoid duplicate tickets, and alert the team if retries fail','good'],['Tell the customer the ticket has been created even though the CRM rejected it','bad']],
    failureGood:'Correct. Test rate limits, idempotency and escalation. Only confirm creation once the target system has accepted the ticket.',
    failureBad:'A failed request is not a successful ticket. Test for non-success responses, use bounded retries and prevent duplicate submissions.',
    finalFlow:['Form / message','Validate & classify','CRM API','Success: confirm'],
    badFlow:['API fails','Retry / escalate'],
    evidence:['Design: routing logic, data fields and the decision on whether AI is justified.','Integrate: configured connector / API requests, permissions and field mapping.','Test: successful ticket, rate-limited response, retries and duplicate prevention.']
  },
  training: {
    name:'Staff training bookings', icon:'🎓',
    situation:'An employee requests an internal training course. Their manager must approve the request and the employee needs an automatic update when the decision is made.',
    facts:['Microsoft 365 is in use','Standard approvals','No external booking yet'],
    baseFlow:['Request form','Manager approval','Decision recorded','Employee update'],
    whyNo:'Microsoft 365 forms, approval actions and notifications can support this initial workflow without bespoke code.',
    whyLow:'Custom development could work, but for this initial process existing actions are likely easier to build, support and audit.',
    probeNo:{q:'What should you validate before relying on native connectors?',options:[['Approval permissions, licensing, failure notifications and audit trail','The right check'],['Only the colour of the request form','Not the main risk']],explain:'Check that the approvals reach the right manager, permissions are correct, licensing permits the flow and unsuccessful actions do not silently disappear.'},
    probeLow:{q:'When would custom integration be justified?',options:[['When a required booking system or complex rule cannot be handled reliably with the native actions','A defensible justification'],['Whenever the organisation has a developer available','Not sufficient on its own']],explain:'The low-code decision should respond to constraints in the system or process, not simply the availability of coding skills.'},
    change:'The company now wants approved requests booked directly with an external training provider. The provider has an API but no prebuilt connector.',
    question:'Must you switch to low-code?',
    changeOptions:[['Not necessarily. Check HTTP actions, authentication and mappings in the existing platform.','recommended'],['Yes. Any use of an API requires custom programming.','weak']],
    changeGood:'Correct. Some no-code tools can call APIs. Low-code becomes useful if custom authentication, transformation or error handling exceeds what native actions reliably support.',
    changeWeak:'An API is an interface, not proof that code is needed. First assess the connector and HTTP options, security and ongoing maintenance.',
    finalPrompt:'The provider API replies “course full”. What should happen?',
    failureChoices:[['Mark the booking as unconfirmed, notify HR / employee and offer an alternative or review','good'],['Send the normal booking confirmation so the workflow finishes','bad']],
    failureGood:'Correct. An approval does not guarantee a booking. Test the rejected-booking path and prevent a false confirmation.',
    failureBad:'The booking failed. Test rejection handling and keep the request pending, rather than confirming a place that does not exist.',
    finalFlow:['Approved request','Booking API','Place available?','Success: confirm'],
    badFlow:['Course full','Notify / resolve'],
    evidence:['Design: approval rules, booking states and error-handling diagram.','Integrate: connector / HTTP configuration and request-response mapping.','Test: approved booking, full-course rejection and notification accuracy.']
  },
  invoice: {
    name:'Invoice processing', icon:'🧾',
    situation:'Suppliers upload invoices with structured fields into a finance portal. The finance team wants to route invoices for approval according to their amount and notify the approver.',
    facts:['Invoice fields already structured','Rules based on amount','Finance tool offers a connector'],
    baseFlow:['Supplier portal','Validate fields','Approval rule','Notify approver'],
    whyNo:'Structured invoice fields, amount-based conditions and an existing finance connector are usually suitable for no-code automation. AI extraction is not needed for this initial case.',
    whyLow:'Low-code is possible, but writing custom extraction or routing code for data already in structured fields introduces maintenance without clear value.',
    probeNo:{q:'What should you check before using the finance connector?',options:[['Field validation, access permissions and duplicate-invoice handling','The right check'],['Whether every invoice can be approved automatically','Not a safe assumption']],explain:'Financial workflows need appropriate controls. Validate data, permissions, audit events and duplicate detection rather than assuming every incoming invoice is valid.'},
    probeLow:{q:'Which requirement could justify custom logic?',options:[['A complex validation rule that existing actions cannot express reliably','A defensible justification'],['The desire to replace supported connectors with scripts','Not sufficient on its own']],explain:'Custom code is justified by a specific constraint and should be evaluated against support, security and testing obligations.'},
    change:'A supplier starts sending scanned PDF invoices. The system must extract fields and check them against purchase orders, but the finance system has no ready-made connector for this check.',
    question:'What is the right next step?',
    changeOptions:[['Evaluate document extraction, validation and API options; use AI only where it adds value.','recommended'],['Use AI for every decision and automatically approve extracted amounts.','weak']],
    changeGood:'Correct. OCR or document AI may help extract scanned fields, but amounts and supplier identifiers should be validated. A no-code API action may still work; human review is important for low-confidence or mismatched data.',
    changeWeak:'AI extraction can make mistakes. Do not automatically approve financially significant values without controls; verify the integration capabilities and validation steps first.',
    finalPrompt:'The same invoice number arrives twice. What should happen?',
    failureChoices:[['Flag the potential duplicate for review; do not create a second payable invoice','good'],['Process it twice because both files were received successfully','bad']],
    failureGood:'Correct. Test duplicate detection, including the supplier identifier and invoice number, and route ambiguous cases for review.',
    failureBad:'Transport success does not prove financial validity. Duplicate detection and exception handling need explicit test cases.',
    finalFlow:['PDF invoice','Extract + validate','Finance API','Valid: route'],
    badFlow:['Duplicate / mismatch','Hold for review'],
    evidence:['Design: process map, extraction confidence and approval / exception rules.','Integrate: extraction and finance API or connector configuration.','Test: valid invoice, duplicate invoice and low-confidence field extraction.']
  }
};
const state={scenario:'support',step:0,approach:null,probe:null,change:null,failure:null};
const stage=document.getElementById('stage'), bar=document.getElementById('scenarioButtons');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setupBar(){bar.innerHTML=Object.entries(scenarios).map(([id,s])=>`<button type="button" class="scenarioBtn" aria-pressed="${state.scenario===id}" data-scenario="${id}"><span class="scenarioIcon" aria-hidden="true">${s.icon}</span><span>${escapeHtml(s.name)}</span></button>`).join('');}
function choose(list,group){return `<div class="choices ${list.length>2?'compact':''}" role="group" aria-label="${escapeHtml(group)}">${list.map((v,i)=>`<button type="button" class="choice" aria-pressed="false" data-choice="${group}" data-value="${i}"><b>${String.fromCharCode(65+i)} · ${escapeHtml(v[0])}</b>${v[2]?`<span>${escapeHtml(v[2])}</span>`:''}</button>`).join('')}</div>`;}
function page(inner){stage.innerHTML=`<div class="progress" aria-label="Stage ${state.step+1} of 4">${[0,1,2,3].map(i=>`<div class="prog ${i<=state.step?'done':''}"></div>`).join('')}</div>${inner}`;}
function controls(nextText,disabled=true,back=true){return `<div class="controls"><button type="button" class="primary" id="nextBtn" ${disabled?'disabled':''}>${escapeHtml(nextText)} →</button>${back?'<button type="button" class="secondary" id="backBtn">← Previous</button>':''}</div>`;}
function info(title,msg,caution=false){return `<div class="feedback ${caution?'caution':''}" role="status"><strong>${escapeHtml(title)}</strong><p>${escapeHtml(msg)}</p></div>`;}
function flow(nodes,cls=''){return `<div class="flow ${cls}" aria-label="Illustrative workflow">${nodes.map((n,i)=>`${i?'<span class="flowArrow" aria-hidden="true">→</span>':''}<div class="flowNode">${escapeHtml(n)}</div>`).join('')}</div>`;}
function getS(){return scenarios[state.scenario];}
function render(){setupBar();const s=getS();
 if(state.step===0){page(`<div class="stepLine"><span class="stepNumber">01</span><span class="stepName">Make a recommendation</span></div><h2>${escapeHtml(s.name)}</h2><p class="lead">${escapeHtml(s.situation)}</p><div class="facts">${s.facts.map(f=>`<span class="fact">${escapeHtml(f)}</span>`).join('')}</div><div class="prompt">Which approach would you start with?</div>${choose([['No-code','Use existing connectors and configured actions.'],['Low-code','Add custom logic or API code where needed.']],'approach')}${controls('Explain the trade-off',!state.approach,false)}`);selectStored('approach',state.approach==='nocode'?0:state.approach==='lowcode'?1:-1);}
 if(state.step===1){const q=state.approach==='lowcode'?s.probeLow:s.probeNo;page(`<div class="stepLine"><span class="stepNumber">02</span><span class="stepName">Defend your choice</span></div><h2>${state.approach==='nocode'?'You chose no-code.':'You chose low-code.'}</h2>${info('Consider the trade-off',state.approach==='nocode'?s.whyNo:s.whyLow,state.approach==='lowcode')}${flow(s.baseFlow)}<div class="prompt">${escapeHtml(q.q)}</div>${choose(q.options,'probe')}<div id="probeFeedback"></div>${controls('See a new requirement',state.probe===null)}`);selectStored('probe',state.probe);if(state.probe!==null)document.getElementById('probeFeedback').innerHTML=info(state.probe===0?'Good judgement':'Think about the requirement',q.explain,state.probe!==0);}
 if(state.step===2){page(`<div class="stepLine"><span class="stepNumber">03</span><span class="stepName">Requirements change</span></div><h2>Now the brief changes.</h2><p class="lead">${escapeHtml(s.change)}</p><div class="rule"></div><div class="prompt">${escapeHtml(s.question)}</div>${choose(s.changeOptions,'change')}<div id="changeFeedback"></div>${controls('Test a failure',state.change===null)}`);selectStored('change',state.change);if(state.change!==null)document.getElementById('changeFeedback').innerHTML=info(state.change===0?'Sound reasoning':'Reconsider the assumption',state.change===0?s.changeGood:s.changeWeak,state.change!==0);}
 if(state.step===3){page(`<div class="stepLine"><span class="stepNumber">04</span><span class="stepName">Test and evidence S11</span></div><h2>What if the automation fails?</h2><p class="lead">${escapeHtml(s.finalPrompt)}</p>${choose(s.failureChoices,'failure')}<div id="failureFeedback"></div><div id="endContent" class="${state.failure===null?'hidden':''}"><div class="rule"></div><div class="subhead">Two outcomes the apprentice should test</div>${flow(s.finalFlow)}<div class="flow">${s.badFlow.map((n,i)=>`${i?'<span class="flowArrow" aria-hidden="true">→</span>':''}<div class="flowNode warm">${escapeHtml(n)}</div>`).join('')}</div><section class="evidence"><h3>S11 · What evidence would demonstrate competence?</h3><ul>${s.evidence.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></section><p class="lesson">Choose the simplest solution that reliably meets the requirements—and test what happens when it doesn't.</p></div><div class="controls"><button type="button" class="secondary" id="restartBtn">↺ Restart this scenario</button><button type="button" class="secondary" id="backBtn">← Previous</button></div>`);selectStored('failure',state.failure);if(state.failure!==null)document.getElementById('failureFeedback').innerHTML=info(state.failure===0?'Appropriate failure handling':'A risky assumption',state.failure===0?s.failureGood:s.failureBad,state.failure!==0);}
 setupActions();
}
function selectStored(group,index){if(index===null||index<0)return;const elem=stage.querySelector(`[data-choice="${group}"][data-value="${index}"]`);if(elem)elem.setAttribute('aria-pressed','true');}
function setupActions(){stage.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{const group=el.dataset.choice, index=Number(el.dataset.value);const siblings=stage.querySelectorAll(`[data-choice="${group}"]`);siblings.forEach(x=>x.setAttribute('aria-pressed',String(x===el)));if(group==='approach'){state.approach=index===0?'nocode':'lowcode';state.probe=null;state.change=null;state.failure=null;}else if(group==='probe'){state.probe=index;}else if(group==='change'){state.change=index;}else if(group==='failure'){state.failure=index;}
 if(group==='approach')document.getElementById('nextBtn').disabled=false;
 if(group==='probe'){document.getElementById('nextBtn').disabled=false;const q=state.approach==='lowcode'?getS().probeLow:getS().probeNo;document.getElementById('probeFeedback').innerHTML=info(index===0?'Good judgement':'Think about the requirement',q.explain,index!==0)}
 if(group==='change'){document.getElementById('nextBtn').disabled=false;const s=getS();document.getElementById('changeFeedback').innerHTML=info(index===0?'Sound reasoning':'Reconsider the assumption',index===0?s.changeGood:s.changeWeak,index!==0)}
 if(group==='failure'){const s=getS();document.getElementById('failureFeedback').innerHTML=info(index===0?'Appropriate failure handling':'A risky assumption',index===0?s.failureGood:s.failureBad,index!==0);document.getElementById('endContent').classList.remove('hidden')}
 }));const next=document.getElementById('nextBtn');if(next)next.addEventListener('click',()=>{if(state.step<3){state.step++;render();stage.focus({preventScroll:true});}});const back=document.getElementById('backBtn');if(back)back.addEventListener('click',()=>{if(state.step>0){state.step--;render();stage.focus({preventScroll:true});}});const restart=document.getElementById('restartBtn');if(restart)restart.addEventListener('click',()=>{reset(state.scenario);stage.focus({preventScroll:true});});}
function reset(id){state.scenario=id;state.step=0;state.approach=null;state.probe=null;state.change=null;state.failure=null;render();}
bar.addEventListener('click',e=>{const btn=e.target.closest('[data-scenario]');if(!btn)return;if(btn.dataset.scenario!==state.scenario)reset(btn.dataset.scenario);});
render();
</script>
</body>
</html>
